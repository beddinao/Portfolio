	<script>
		var all_view_change= (tc,o_v,n_v)=> {
			document.querySelectorAll(tc).forEach(el=>el.classList.replace(o_v,n_v));
		}
		document.querySelectorAll('.view_l').forEach(link => {
			link.onclick = e => {
				all_view_change('.view_l','hidden','active');	
				e.target.classList.replace('active', 'hidden');
				all_view_change('.view','active','hidden');
				document.getElementById(e.target.id.replace('_link', '')).classList.replace('hidden', 'active');
			}
		})
	</script>
	</body>
