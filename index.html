<!DOCTYPE html>

		<link rel='stylesheet' href='./assets/style.css' >

	<body>
		<div id='navbar'>
			<p id='main_page_link' class='view_l hidden'>main</p>
			<p id='about_page_link' class='view_l'>about</p>
			<p id='work_page_link' class='view_l'>work</p>
		</div>
		<div id='main_stuff'>
			<div id='main_page' class='view'></div>

		<div id='footer'>
			<p>
			// [SYS.INFRA]<br>

			// FROM MANUAL MEMORY ALLOCATION TO<br>

			</p>

			/*<br>

                    	*/
			</p>
		</div>
	<script>
		var switch_view = id => {
  			document.querySelectorAll('.view').forEach(div => div.classList.add('hidden'));
 			document.getElementById(id).classList.remove('hidden');
		}
		document.querySelectorAll('.view_l').forEach(link => {
			link.onclick = e => {
				switch_view(e.target.id.replace('_link', ''));
				document.querySelectorAll('.view_l').forEach(l=>l.classList.remove('hidden'));
				e.target.classList.add('hidden');
			}
		})
	</script>
	</body>
